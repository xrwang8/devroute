<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>DevRoute</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <span class="title">DevRoute</span>
    <label class="toggle">
      <input type="checkbox" id="globalEnabled">
      <span class="slider"></span>
    </label>
  </div>

  <div class="rule-desc">URL 中包含左侧关键词时，替换为右侧关键词（仅对 XHR/Fetch 请求生效）</div>

  <div id="ruleList"></div>

  <button id="addRule" class="btn-add">+ 添加规则</button>

  <div class="test-section">
    <div class="test-label">测试替换</div>
    <div class="test-input-row">
      <input type="text" id="testInput" placeholder="输入 URL 测试替换效果">
      <button id="genExample" class="btn-gen">示例</button>
    </div>
    <div id="testOutput" class="test-output"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
